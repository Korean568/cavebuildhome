@media (max-width:720px){#launcher .lmarket{padding:10px 12px}}</style></head><body>
<div id="launcher">

<script>
const GAME_URL='https://korean568.github.io/cavebuild/';
const $=id=>document.getElementById(id),makeCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function h2(i,j,s){let h=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(s,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}

const LOGO_G={
  T:['#####','..#..','..#..','..#..','..#..','..#..','..#..'],R:['####.','#...#','#...#','####.','#.#..','#..#.','#...#'],'3':['####.','....#','....#','.###.','....#','....#','####.'],' ':['.....','.....','.....','.....','.....','.....','.....'], // 겜벗 로고(TRIBE 3D)용
  C:['.###.','#...#','#....','#....','#....','#...#','.###.'],
  A:['..#..','.#.#.','#...#','#...#','#####','#...#','#...#'],
  V:['#...#','#...#','#...#','#...#','#...#','.#.#.','..#..'],
  E:['#####','#....','#....','####.','#....','#....','#####'],
  B:['####.','#...#','#...#','####.','#...#','#...#','####.'],
  U:['#...#','#...#','#...#','#...#','#...#','#...#','.###.'],
  I:['#####','..#..','..#..','..#..','..#..','..#..','#####'],
  L:['#....','#....','#....','#....','#....','#....','#####'],
  D:['####.','#...#','#...#','#...#','#...#','#...#','####.'],
};

function makeLogo(S=28,D=10,word=/\/noejeol\//.test(location.pathname)?'DLIUBEVAC':'CAVEBUILD'){ // 뇌절모드는 로고를 거꾸로
  const cells=[];let col=0;
  for(const ch of word){const g=LOGO_G[ch];
    for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(g[r][c]==='#')cells.push([col+c,r]);
    col+=6;}
  const W=(col-1)*S+D+8,H=7*S+D+8,o=makeCanvas(W,H),g2=o.getContext('2d'),set=new Set(cells.map(p=>p[0]+','+p[1]));
  const sh=(c,f)=>`rgb(${c.map(v=>clamp(v*f|0,0,255)).join(',')})`;
  const baseOf=(c,r)=>{ // 위는 잔디, 아래로 흙 → 돌
    const b=r===0?[96,162,58]:r===1?(h2(c,r,9)<.45?[70,124,42]:[140,98,60]):r<=2?[140,98,60]:[138,138,146];
    const j=.93+h2(c,r,3)*.14;return b.map(v=>v*j);};
  const ox=4,oy=4+D;
  for(const [c,r] of cells.slice().sort((a,b)=>b[1]-a[1]||a[0]-b[0])){ // 윗면·옆면
    const x=ox+c*S,y=oy+r*S,b=baseOf(c,r);
    if(!set.has(c+','+(r-1))){g2.fillStyle=sh(b,1.42);g2.beginPath();g2.moveTo(x,y);g2.lineTo(x+D,y-D);g2.lineTo(x+S+D,y-D);g2.lineTo(x+S,y);g2.fill();}
    if(!set.has((c+1)+','+r)){g2.fillStyle=sh(b,.58);g2.beginPath();g2.moveTo(x+S,y);g2.lineTo(x+S+D,y-D);g2.lineTo(x+S+D,y+S-D);g2.lineTo(x+S,y+S);g2.fill();}
  }
  const ORE=[[42,42,48],[214,160,120],[79,224,216]]; // 석탄 · 철 · 수정
  for(const [c,r] of cells){ // 앞면
    const x=ox+c*S,y=oy+r*S,b=baseOf(c,r);
    g2.fillStyle=sh(b,1);g2.fillRect(x,y,S,S);
    g2.fillStyle=sh(b,1.22);g2.fillRect(x,y,S-1,2);g2.fillStyle=sh(b,1.14);g2.fillRect(x,y,2,S-1);
    g2.fillStyle=sh(b,.74);g2.fillRect(x,y+S-2,S,2);g2.fillStyle=sh(b,.78);g2.fillRect(x+S-2,y,2,S);
    if(r>=4&&h2(c,r,21)>.82){const oc=ORE[(h2(c,r,22)*3)|0]; // 돌 속 광석
      for(let k=0;k<4;k++){const bx=x+4+((h2(c*7+k,r,23)*(S-11))|0),by=y+4+((h2(c,r*7+k,24)*(S-11))|0);
        g2.fillStyle=sh(oc,1);g2.fillRect(bx,by,5,5);g2.fillStyle=sh(oc,1.5);g2.fillRect(bx,by,2,2);}}
    if(r===0){g2.fillStyle=sh([96,162,58],1.5); // 잔디 윗면의 풀잎
      for(let k=0;k<3;k++)g2.fillRect(x+3+((h2(c*5+k,0,25)*(S-7))|0),y+1,1,3);}
  }
  const f=makeCanvas(W,H),fc=f.getContext('2d'); // 어두운 테두리
  for(let a=0;a<8;a++){const an=a*Math.PI/4;fc.drawImage(o,Math.round(Math.cos(an)*3),Math.round(Math.sin(an)*3));}
  fc.globalCompositeOperation='source-in';fc.fillStyle='#1a1410';fc.fillRect(0,0,W,H);
  fc.globalCompositeOperation='source-over';fc.drawImage(o,0,0);
  return f;
}

function makeLauncherIcon(S=64){ // 런처 아이콘: 어두운 둥근 판 · 입체 잔디 블록 · 초록 ▶ 플레이 표시
  const c=makeCanvas(S,S),g=c.getContext('2d'),k=S/64;
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
  g.fillStyle='#141414';rr(0,0,S,S,13*k);g.fill();g.fillStyle='#262626';rr(2*k,2*k,S-4*k,S-4*k,11*k);g.fill();
  const cx=29*k,top=10*k,w=20*k,h=11*k,d=22*k; // 입체 블록: 윗면(잔디) · 왼쪽 · 오른쪽(흙)
  const poly=(pts,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))g.lineTo(p[0],p[1]);g.closePath();g.fill();};
  poly([[cx,top],[cx+w,top+h],[cx,top+2*h],[cx-w,top+h]],'#6ab43a');
  poly([[cx-w,top+h],[cx,top+2*h],[cx,top+2*h+d],[cx-w,top+h+d]],'#8a5a32');
  poly([[cx+w,top+h],[cx,top+2*h],[cx,top+2*h+d],[cx+w,top+h+d]],'#6e4626');
  poly([[cx-w,top+h],[cx,top+2*h],[cx,top+2*h+5*k],[cx-w,top+h+5*k]],'#4f9a2c');poly([[cx+w,top+h],[cx,top+2*h],[cx,top+2*h+5*k],[cx+w,top+h+5*k]],'#3f7f24');
  for(let i=0;i<14;i++){const x=cx-w+3*k+h2(i,1,51)*(2*w-6*k),y=top+h+7*k+h2(1,i,52)*(d-8*k);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,y,2*k,2*k);}

        <h4>${T2('🪙 케이브코인 사기','🪙 Buy CaveCoins')}</h4><div class="mk-packs">${[5,10,50,100].map(k=>`<button class="${st.pack===k?'on':''}" data-pk="${k}">🪙 ${k}<small>${won(k)}</small></button>`).join('')}<button class="${st.pack==='c'?'on':''}" data-pk="c">✏ ${T2('직접 입력','Custom')}<small>5~100000</small></button></div>
        ${st.pack==='c'?`<label>${T2('살 코인 수 (5~100000)','Coins (5–100000)')}<input id="mkC" type="number" min="5" max="100000" value="${st.custom||200}"></label>`:''}
        <div class="mk-b" id="mkPB">${st.prov.length?'':`<div class="tip">⏳ ${T2('결제 준비 중이에요. 운영자가 결제를 열면 여기서 돈을 내고 케이브코인을 살 수 있어요.','Payments are being set up. Once the operator enables them you can buy CaveCoins here.')}</div>`}${st.prov.map(p=>{const mn=mins[p]||0,ok=c>=5&&c<=100000&&c*st.kpc>=mn;return `<button data-a="paycoin" data-p="${p}"${ok?'':' disabled'}>${PN[p]} · ${isW(p)?won(c):usd(c)}${ok?'':`<small> (${mn.toLocaleString()}${T2('원부터','₩ min')})</small>`}</button>`;}).join('')}</div>
        <div class="tip">${T2('케이브코인은 돈을 내고 사요 (1코인 = 10원). 결제가 확인된 뒤에만 코인이 들어와요. 결제 수단마다 받을 수 있는 가장 작은 금액이 달라서, 작은 묶음은 일부 결제 수단만 돼요.','CaveCoins are bought with real money (1 coin = ₩10) and are added only after the payment is confirmed. Each payment method has a minimum amount, so small packs work only with some methods.')}</div>
        <h4>${T2('최근 기록','Recent history')}</h4><div class="mk-log">${st.log?st.log.map(x=>`<div>${x.delta>0?'+':''}${x.delta.toLocaleString()} · ${hEsc(x.reason)} <small>${new Date(x.at).toLocaleString()}</small></div>`).join('')||T2('아직 없어요','Nothing yet'):'…'}</div></div>`:`<div class="tip">🔑 ${T2('로그인해 주세요','Please log in')}</div>`;}
    else if(st.tab==='admin'&&admin){
      h+=`<div class="mk-form"><div class="tip">${T2('운영자 코인 지급 · 운영자 확인 코드가 맞아야 해요 (5번 틀리면 10분 잠김 · 모든 지급은 기록에 남아요)','Operator coin grant · requires the operator code (locked 10 min after 5 wrong tries · every grant is logged)')}</div>
        <label>${T2('받을 닉네임 (비우면 나)','Recipient nickname (blank = me)')}<input id="mkAT" maxlength="20"></label><label>${T2('코인','Coins')}<input id="mkAC" type="number" min="1" max="1000000" value="1000"></label>
        <label>${T2('운영자 확인 코드','Operator code')}<input id="mkAK" type="text" inputmode="numeric" maxlength="40" autocomplete="one-time-code" name="cb-admin-code" style="-webkit-text-security:disc" spellcheck="false"></label><button id="mkAGo">🪙 ${T2('지급하기','Grant')}</button></div>`;}
    MK.innerHTML=h;
    MK.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;st.msg='';if(st.tab==='coin'&&hTok())hApi({action:'coin_me',token:hTok()}).then(d=>{st.log=d.log;if(st.me)st.me.coins=d.coins;draw();}).catch(()=>{});draw();});
    const lg=MK.querySelector('#mkLogin');if(lg)lg.onclick=e=>{e.preventDefault();$('lUser').parentElement.click();};
    const all=st.mods; // 기본 모드 카드는 안 보임
    MK.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const m=all[+b.dataset.i],a=b.dataset.a;
      if(a==='inst')run(async()=>install(m,await getCode(m)));
      else if(a==='uninst')uninstall(m);
      else if(a==='buy'){if(!hTok()){say(T2('🔑 먼저 로그인해 주세요','🔑 Please log in first'),0);return;}if(!confirm(T2(`「${m.name}」을(를) ${m.price} 케이브코인으로 살까요?`,`Buy "${m.name}" for ${m.price} CaveCoins?`)))return;
        run(async()=>{await hApi({action:'mk_buy',token:hTok(),id:m.id});await load();install(m,await getCode(m));});}
      else if(a==='paymod')pay(b.dataset.p,{kind:'mod',id:m.id});
      else if(a==='paycoin'){const c=st.pack==='c'?Math.floor(+st.custom||0):st.pack;if(!(c>=5&&c<=100000)){say(T2('5~100000 코인까지 살 수 있어요','5–100000 coins'),0);return;}pay(b.dataset.p,{kind:'coin',coins:c});}
      else if(a==='edit'){st.edit=m;st.tab='sell';st.msg='';draw();}
      else if(a==='del'){if(!confirm(T2(`「${m.name}」을(를) 마켓에서 내릴까요? (산 사람도 다시 받을 수 없어요)`,`Unlist "${m.name}"?`)))return;run(async()=>{await hApi({action:'mk_del',token:hTok(),id:m.id});await load();},T2('⛔ 내렸어요','⛔ Unlisted'));}});
    const P=MK.querySelector('#mkP');if(P){const f=()=>{$('mkPW').textContent=`= ${won(+P.value||0)} · ${usd(+P.value||0)}`;};P.oninput=f;f();}
    MK.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{st.pack=b.dataset.pk==='c'?'c':+b.dataset.pk;draw();});
    const C=MK.querySelector('#mkC');if(C){C.onchange=()=>{st.custom=Math.floor(+C.value||0);draw();const c2=MK.querySelector('#mkC');if(c2)c2.focus();};C.oninput=()=>{st.custom=Math.floor(+C.value||0);};}
    const go=MK.querySelector('#mkGo');if(go)go.onclick=()=>{const f=$('mkF').files[0],nm=$('mkN').value,ds=$('mkD').value,pr=Math.floor(+$('mkP').value||0);run(async()=>{const e=st.edit||{};let code=f?await f.text():'';if(f&&/\.html?$/i.test(f.name))code=modFromHTML(code,nm.trim()); // 🧩 HTML 모드는 JS로 바꿔서 올림
      if(!code&&e.id)code=await getCode(e);if(!code)throw new Error(T2('모드 파일(.js · .html)을 골라 주세요','Choose a .js or .html mod file'));
      {const mb=new Blob([JSON.stringify(code)]).size/1e6;if(mb>4.2)throw new Error(T2(`모드 파일이 너무 커요 (${mb.toFixed(1)}MB · 4MB까지). 그림은 파일 안에 넣지 말고 인터넷 주소로 불러와 주세요`,`Mod file too big (${mb.toFixed(1)}MB, max 4MB)`));} // 올리기 전에 크기 확인 (서버가 받는 한도 약 4.5MB)
      await hApi({action:'mk_sell',token:hTok(),id:e.id||undefined,name:nm,descr:ds,price:pr,code});st.edit=null;st.tab='shop';await load();},T2('✅ 마켓에 올렸어요','✅ Published'));};
    const cc=MK.querySelector('#mkCancel');if(cc)cc.onclick=()=>{st.edit=null;draw();};
    const ag=MK.querySelector('#mkAGo');if(ag)ag.onclick=()=>run(async()=>{const d=await hApi({action:'admin_coin',token:hTok(),to:$('mkAT').value,coins:Math.floor(+$('mkAC').value||0),code:$('mkAK').value.trim()});$('mkAK').value='';await load();say(T2(`✅ ${d.to} 님에게 지급했어요 (잔액 ${d.coins})`,`✅ Granted to ${d.to} (balance ${d.coins})`));});}
  // 결제사에서 돌아왔을 때: 서버에 확인 요청 → 주소의 결제 정보는 지움
  const Q=new URLSearchParams(location.search),pv=Q.get('pay');
  if(pv){history.replaceState(null,'',back());st.tab='shop';
    setTimeout(()=>{document.querySelector('#launcher [data-tab=market]').click();
      if(pv==='toss')confirmPay({provider:'toss',orderId:Q.get('orderId'),paymentKey:Q.get('paymentKey'),amount:+Q.get('amount')});
      else if(pv==='stripe'||pv==='lemon'||pv==='paddle')confirmPay({orderId:Q.get('order')});
      else say(pv==='cancel'?T2('결제를 취소했어요','Payment cancelled'):T2('❌ 결제가 안 됐어요: ','❌ Payment failed: ')+(Q.get('message')||''),pv==='cancel');},300);}
  document.querySelectorAll('#launcher [data-tab=market]').forEach(e=>e.addEventListener('click',()=>load()));
  draw();}

</script></body></html>
